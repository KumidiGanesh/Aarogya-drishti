server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(self \"https://${VIDEO_DOMAIN}\"), microphone=(self \"https://${VIDEO_DOMAIN}\"), display-capture=(self \"https://${VIDEO_DOMAIN}\"), autoplay=(self \"https://${VIDEO_DOMAIN}\")" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; frame-src 'self' https://${VIDEO_DOMAIN}; img-src 'self' data: blob: https://thumb.wikimedia.org https://upload.wikimedia.org; style-src 'self' 'unsafe-inline'; script-src 'self' https://${VIDEO_DOMAIN}; connect-src 'self' https://${VIDEO_DOMAIN} wss://${VIDEO_DOMAIN} ws://$host wss://$host; font-src 'self' data:" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    proxy_pass http://server:4000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /socket.io/ {
    proxy_pass http://server:4000/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 75s;
    proxy_buffering off;
  }

  location /api-docs/ {
    proxy_pass http://server:4000/api-docs/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
